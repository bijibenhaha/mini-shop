server:
  port: 9001

spring:
  application:
    name: mini-user-service
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/mini_user_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        prefix: ${spring.application.name}
        group: DEFAULT_GROUP
    sentinel:
      transport:
        dashboard: 127.0.0.1:8081

# Seata 配置（直接连接模式）
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: mini-shop-tx-group
  service:
    vgroup-mapping:
      mini-shop-tx-group: default
    grouplist:
      default: 127.0.0.1:8091
  registry:
    type: file
  config:
    type: file

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

logging:
  level:
    com.mini: debug